<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Malam & Siang</title>
    <link rel="icon" href="hilal.png" type="image/png" />
    <style>
        :root {
            --cyan: #00e5ff;
            --amber: #ffb300;
            --bg-panel: rgba(15, 20, 25, 0.65);
            --border-panel: rgba(255, 255, 255, 0.1);
            --text-main: #f0f0f0;
            --text-muted: #a0aab5;
            --font-ui: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background-color: #020205;
            font-family: var(--font-ui);
            color: var(--text-main);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Canvas */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        /* Header / Top Section */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: auto;
        }

        .title-box {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-panel);
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .title-box h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .title-box p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        /* Panels Container */
        .panels-container {
            display: flex;
            gap: 1rem;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: auto;
        }

        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-panel);
            border-radius: 16px;
            padding: 16px;
            width: 320px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }

        .panel-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Grid Data */
        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .data-label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .data-unit {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .full-width { grid-column: span 2; }

        /* Specific Colors */
        .iss-theme { color: var(--cyan); }
        .hilal-theme { color: var(--amber); }

        .date-text { font-size: 0.85rem; }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            font-size: 0.75rem;
            margin-top: 4px;
            font-weight: 600;
        }

        /* 3D Labels */
        .country-label {
            color: rgba(255, 255, 255, 0.9);
            font-family: var(--font-ui);
            font-size: 11px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
            transition: opacity 0.2s ease;
            letter-spacing: 0.5px;
        }

        /* Loader */
        #loader {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #020205;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }
        
        .loader-content {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .ring {
            width: 76px; height: 76px;
            border: 3px solid rgba(0, 229, 255, 0.1);
            border-top: 3px solid var(--cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .progress-text {
            position: absolute;
            font-family: var(--font-mono);
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .loader-text {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--cyan);
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse { 50% { opacity: 0.5; } }

        /* --- RESPONSIVE MOBILE FIX --- */
        @media (max-width: 768px) {
            #ui-layer {
                padding: 12px;
            }
            
            .title-box {
                width: 100%;
                text-align: center;
                padding: 8px 12px;
            }
            
            .title-box h1 { font-size: 0.9rem; }
            
            .panels-container {
                flex-direction: row;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                gap: 12px;
                padding-bottom: 8px; /* For scrollbar */
                /* Hiding scrollbar for cleaner look */
                -ms-overflow-style: none; 
                scrollbar-width: none; 
            }
            .panels-container::-webkit-scrollbar { display: none; }
            
            .panel {
                min-width: 85vw; /* Almost full width on mobile */
                scroll-snap-align: center;
                padding: 14px;
                background: rgba(15, 20, 25, 0.8); /* Slightly darker for readability */
            }

            .data-grid { gap: 10px; }
            .data-value { font-size: 0.85rem; }
            .panel-header { margin-bottom: 10px; padding-bottom: 6px; }
        }
        
        /* Landscape Mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            #ui-layer { flex-direction: row; padding: 10px; }
            .header-section { width: auto; }
            .panels-container { 
                flex-direction: column; 
                width: 280px; 
                overflow-y: auto; 
                justify-content: flex-start;
                gap: 8px;
            }
            .panel { width: 100%; min-width: unset; padding: 10px; }
        }
    </style>

    <!-- Import Map Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-content">
            <div class="ring"></div>
            <div class="progress-text" id="loading-percent">0%</div>
        </div>
        <div class="loader-text" id="loading-status">MEMUAT ASET 3D...</div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        
        <!-- Header -->
        <div class="header-section">
            <div class="title-box">
                <h1>Pantau Hilal gak ? 🤞</h1>
                <p id="ui-time">--:--:-- UTC</p>
            </div>
        </div>

        <!-- Panels Container -->
        <div class="panels-container">
            
            <!-- Panel ISS -->
            <div class="panel">
                <div class="panel-header iss-theme">
                    <div class="dot" style="background: var(--cyan);"></div>
                    <span class="panel-title">Telemetri ISS</span>
                </div>
                <div class="data-grid">
                    <div class="data-item">
                        <span class="data-label">Garis Lintang</span>
                        <span class="data-value iss-theme" id="ui-lat">--.----°</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Garis Bujur</span>
                        <span class="data-value iss-theme" id="ui-lon">--.----°</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Kecepatan</span>
                        <span class="data-value" id="ui-vel">-- <span class="data-unit">km/h</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Ketinggian</span>
                        <span class="data-value" id="ui-alt">-- <span class="data-unit">km</span></span>
                    </div>
                </div>
            </div>

            <!-- Panel Hilal -->
            <div class="panel">
                <div class="panel-header hilal-theme">
                    <div class="dot" style="background: var(--amber);"></div>
                    <span class="panel-title">Sistem Hilal & Waktu</span>
                </div>
                <div class="data-grid">
                    <div class="data-item full-width">
                        <span class="data-value date-text" id="ui-date-masehi">Memuat...</span>
                        <span class="data-value date-text hilal-theme" id="ui-date-hijriah" style="margin-top:2px;">Memuat...</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Umur Bulan</span>
                        <span class="data-value" id="ui-moon-age">--.- <span class="data-unit">Hari</span></span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Iluminasi</span>
                        <span class="data-value" id="ui-moon-phase">--.- <span class="data-unit">%</span></span>
                    </div>
                    <div class="data-item full-width">
                        <span class="data-label">Sudut Elongasi</span>
                        <span class="data-value" id="ui-moon-el">--.-°</span>
                    </div>
                    <div class="data-item full-width">
                        <span class="data-label">Status Rukyatul Hilal</span>
                        <div class="status-badge" id="ui-hilal-status">Menganalisis...</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- DOM Elements ---
        const el = (id) => document.getElementById(id);
        const uiTime = el('ui-time'), uiLat = el('ui-lat'), uiLon = el('ui-lon'), uiVel = el('ui-vel'), uiAlt = el('ui-alt');
        const uiDateMasehi = el('ui-date-masehi'), uiDateHijriah = el('ui-date-hijriah');
        const uiMoonAge = el('ui-moon-age'), uiMoonPhase = el('ui-moon-phase'), uiMoonEl = el('ui-moon-el'), uiHilalStatus = el('ui-hilal-status');
        const loader = el('loader'), loadingStatus = el('loading-status'), loadingPercent = el('loading-percent');

        // --- Config ---
        const R_EARTH = 10;
        const ISS_SCALE = 1.05;
        const R_MOON_ORBIT = 35;
        const API_ISS = 'https://api.wheretheiss.at/v1/satellites/25544';
        const isMobile = window.innerWidth <= 768;

        // --- Islamic Months ---
        const MONTHS_HIJRI = [
            { id: 'Muharram', ar: 'محرم' }, { id: 'Safar', ar: 'صفر' }, { id: 'Rabiul Awal', ar: 'ربيع الأول' },
            { id: 'Rabiul Akhir', ar: 'ربيع الآخر' }, { id: 'Jumadil Awal', ar: 'جمادى الأولى' }, { id: 'Jumadil Akhir', ar: 'جمادى الآخرة' },
            { id: 'Rajab', ar: 'رجب' }, { id: 'Sya\'ban', ar: 'شعبان' }, { id: 'Ramadan', ar: 'رمضان' },
            { id: 'Syawal', ar: 'شوال' }, { id: 'Dzulqa\'dah', ar: 'ذو القعدة' }, { id: 'Dzulhijjah', ar: 'ذو الحجة' }
        ];

        // --- Global Vars ---
        let scene, camera, renderer, labelRenderer, controls;
        let earth, clouds, moon, issGroup, sunLight, sunGlow;
        let trailLine, trailPos = [];
        let labels = [];
        let issTarget = new THREE.Vector3();
        let initialized = false;

        // Reduced country list for performance
        const COUNTRIES = [
            { name: "Indonesia", lat: -0.789, lon: 113.921 }, { name: "Jepang", lat: 36.204, lon: 138.252 },
            { name: "Australia", lat: -25.274, lon: 133.775 }, { name: "USA", lat: 37.090, lon: -95.712 },
            { name: "Inggris", lat: 55.378, lon: -3.435 }, { name: "Rusia", lat: 61.524, lon: 105.318 },
            { name: "Cina", lat: 35.861, lon: 104.195 }, { name: "India", lat: 20.593, lon: 78.962 },
            { name: "Arab Saudi", lat: 23.885, lon: 45.079 }, { name: "Mesir", lat: 26.820, lon: 30.802 },
            { name: "Brasil", lat: -14.235, lon: -51.925 }, { name: "Afsel", lat: -30.559, lon: 22.937 }
        ];

        // Texture Base
        const TEX_URL = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/';

        // --- Math Helpers ---
        const latLonToVec = (lat, lon, radius) => {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = lon * (Math.PI / 180);
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                -radius * Math.sin(phi) * Math.sin(theta)
            );
        };

        const createGlowTexture = (r, g, b, a) => {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, `rgba(${r},${g},${b},${a})`);
            grad.addColorStop(0.3, `rgba(${r},${g},${b},${a * 0.5})`);
            grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        };

        // --- Islamic Calendar Logic ---
        function getIslamicDate(now) {
            try {
                const parts = new Intl.DateTimeFormat('en', { calendar: 'islamic', day: 'numeric', month: 'numeric', year: 'numeric' }).formatToParts(now);
                let d, m, y;
                parts.forEach(p => {
                    if(p.type === 'day') d = parseInt(p.value);
                    else if(p.type === 'month') m = parseInt(p.value);
                    else if(p.type === 'year') y = parseInt(p.value);
                });
                if (m && d && y) return { day: d, month: MONTHS_HIJRI[m - 1], year: y };
            } catch (e) {}
            return { day: 1, month: MONTHS_HIJRI[0], year: 1445 }; // Fallback dummy
        }

        function updateUI() {
            const now = new Date();
            uiTime.innerText = now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            
            // Format Masehi
            uiDateMasehi.innerText = new Intl.DateTimeFormat('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
            
            // Format Hijriah
            const hijri = getIslamicDate(now);
            uiDateHijriah.innerText = `${hijri.day} ${hijri.month.id} (${hijri.month.ar}) ${hijri.year} H`;
        }

        // --- Initialize 3D ---
        function init() {
            const container = el('canvas-container');
            const w = window.innerWidth, h = window.innerHeight;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(0, 10, 35);

            // Fast Renderer settings
            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
            renderer.setSize(w, h);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(w, h);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = R_EARTH + 1.5;
            controls.maxDistance = 100;
            controls.enablePan = false;

            loadAssets();
            window.addEventListener('resize', onWindowResize);
            setInterval(updateUI, 1000);
            updateUI();
        }

        function loadAssets() {
            const manager = new THREE.LoadingManager();
            const texLoader = new THREE.TextureLoader(manager);
            const textures = {};

            let targetProgress = 0;
            let currentProgress = 0;

            manager.onProgress = (_, loaded, total) => {
                targetProgress = (loaded / total) * 100;
            };

            manager.onLoad = () => {
                targetProgress = 100;
            };

            // Animasi Loading Persentase (Mulus/Smooth Easing)
            const loaderInterval = setInterval(() => {
                // Pergerakan angka perlahan menuju target sebenarnya
                currentProgress += (targetProgress - currentProgress) * 0.1;
                
                // Jika unduhan tersendat/nunggu koneksi, kita majukan pelan-pelan (mentok 95%)
                if (targetProgress < 100 && (targetProgress - currentProgress) < 1) {
                    targetProgress += 0.4;
                    if (targetProgress > 95) targetProgress = 95;
                }

                // Bulatkan penuh saat mendekati 100
                if (currentProgress > 99.5) currentProgress = 100;

                loadingPercent.innerText = Math.floor(currentProgress) + '%';

                // Setelah menyentuh angka 100%
                if (currentProgress === 100) {
                    clearInterval(loaderInterval);
                    loadingStatus.innerText = 'MEMULAI SISTEM...';
                    
                    buildUniverse(textures);
                    fetchISS();
                    setInterval(fetchISS, 5000);

                    setTimeout(() => {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.display = 'none', 600);
                        initialized = true;
                        animate();
                    }, 500);
                }
            }, 25); // refresh rate persentase

            textures.earth = texLoader.load(TEX_URL + 'earth_atmos_2048.jpg');
            textures.bump = texLoader.load(TEX_URL + 'earth_specular_2048.jpg');
            textures.clouds = texLoader.load(TEX_URL + 'earth_clouds_1024.png');
            textures.moon = texLoader.load(TEX_URL + 'moon_1024.jpg');
        }

        function buildUniverse(tex) {
            scene.add(new THREE.AmbientLight(0x222233, 0.4));

            sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
            scene.add(sunLight);

            const sunGlowTex = createGlowTexture(255, 240, 220, 1);
            const sunMat = new THREE.SpriteMaterial({ map: sunGlowTex, blending: THREE.AdditiveBlending, depthWrite: false });
            sunGlow = new THREE.Sprite(sunMat);
            sunGlow.scale.set(60, 60, 1);
            scene.add(sunGlow);

            const earthMat = new THREE.MeshStandardMaterial({
                map: tex.earth,
                roughnessMap: tex.bump,
                roughness: 0.7,
                metalness: 0.1
            });
            earth = new THREE.Mesh(new THREE.SphereGeometry(R_EARTH, 48, 48), earthMat);
            scene.add(earth);

            const cloudMat = new THREE.MeshStandardMaterial({
                map: tex.clouds, transparent: true, opacity: 0.6,
                blending: THREE.AdditiveBlending, depthWrite: false
            });
            clouds = new THREE.Mesh(new THREE.SphereGeometry(R_EARTH + 0.15, 48, 48), cloudMat);
            earth.add(clouds);

            const atmosMat = new THREE.MeshBasicMaterial({
                color: 0x00aaff, transparent: true, opacity: 0.15,
                blending: THREE.AdditiveBlending, side: THREE.BackSide
            });
            const atmosphere = new THREE.Mesh(new THREE.SphereGeometry(R_EARTH + 0.4, 32, 32), atmosMat);
            earth.add(atmosphere);

            moon = new THREE.Mesh(
                new THREE.SphereGeometry(R_EARTH * 0.27, 32, 32),
                new THREE.MeshStandardMaterial({ map: tex.moon, roughness: 1, metalness: 0 })
            );
            scene.add(moon);

            createStars(isMobile ? 1000 : 2000);
            createLabels();
            createISS();

            const trailMat = new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.5 });
            trailLine = new THREE.Line(new THREE.BufferGeometry(), trailMat);
            scene.add(trailLine);
        }

        function createStars(count) {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i+=3) {
                const r = R_EARTH + 50 + Math.random() * 150;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                pos[i] = r * Math.sin(phi) * Math.cos(theta);
                pos[i+1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i+2] = r * Math.cos(phi);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 });
            scene.add(new THREE.Points(geo, mat));
        }

        function createLabels() {
            COUNTRIES.forEach(c => {
                const div = document.createElement('div');
                div.className = 'country-label';
                div.textContent = c.name;
                const label = new CSS2DObject(div);
                const pos = latLonToVec(c.lat, c.lon, R_EARTH + 0.2);
                label.position.copy(pos);
                earth.add(label);
                labels.push({ obj: label, pos: pos, el: div });
            });
        }

        function createISS() {
            issGroup = new THREE.Group();
            
            const core = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.1, 0.1),
                new THREE.MeshStandardMaterial({ color: 0xffffff })
            );
            
            const panelMat = new THREE.MeshStandardMaterial({ color: 0x112244, metalness: 0.8, roughness: 0.2 });
            const p1 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.02, 0.3), panelMat); p1.position.x = 0.6;
            const p2 = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.02, 0.3), panelMat); p2.position.x = -0.6;
            
            const glowTex = createGlowTexture(0, 229, 255, 1);
            const glowMat = new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false });
            const issGlow = new THREE.Sprite(glowMat);
            issGlow.scale.set(1.5, 1.5, 1);
            
            issGroup.add(core, p1, p2, issGlow);
            scene.add(issGroup);
        }

        async function fetchISS() {
            try {
                const res = await fetch(API_ISS);
                const d = await res.json();
                
                uiLat.innerText = `${d.latitude.toFixed(4)}°`;
                uiLon.innerText = `${d.longitude.toFixed(4)}°`;
                uiVel.innerHTML = `${Math.round(d.velocity).toLocaleString()} <span class="data-unit">km/h</span>`;
                uiAlt.innerHTML = `${Math.round(d.altitude).toLocaleString()} <span class="data-unit">km</span>`;

                issTarget.copy(latLonToVec(d.latitude, d.longitude, R_EARTH * ISS_SCALE));
                
                if (trailPos.length === 0) issGroup.position.copy(issTarget);
                
                trailPos.push(issTarget.clone());
                if (trailPos.length > 100) trailPos.shift();
                
                const arr = new Float32Array(trailPos.length * 3);
                for(let i=0; i<trailPos.length; i++){
                    arr[i*3] = trailPos[i].x; arr[i*3+1] = trailPos[i].y; arr[i*3+2] = trailPos[i].z;
                }
                trailLine.geometry.setAttribute('position', new THREE.BufferAttribute(arr, 3));
                
            } catch (e) { console.warn("ISS API Error"); }
        }

        function updateAstronomy() {
            const now = new Date();
            const oneDay = 86400000;
            
            const start = new Date(now.getUTCFullYear(), 0, 0);
            const doy = Math.floor((now - start) / oneDay);
            const sunDecl = -23.44 * Math.cos((360 / 365.24) * (doy + 10) * Math.PI / 180);
            const utcH = now.getUTCHours() + now.getUTCMinutes() / 60;
            let sunLon = 180 - utcH * 15;
            
            const sunPos = latLonToVec(sunDecl, sunLon, 250);
            sunLight.position.copy(sunPos);
            sunGlow.position.copy(sunPos);

            const KNOWN_NEW = 1704974220000;
            const LUNAR_CYCLE = 29.530588;
            let ageDays = ((now.getTime() - KNOWN_NEW) / oneDay) % LUNAR_CYCLE;
            if (ageDays < 0) ageDays += LUNAR_CYCLE;
            
            const elong = (ageDays / LUNAR_CYCLE) * 360;
            let moonLon = sunLon - elong;
            const moonDecl = sunDecl + 5.14 * Math.sin((ageDays / LUNAR_CYCLE) * Math.PI * 2);
            
            const phase = 0.5 * (1 - Math.cos(elong * Math.PI / 180)) * 100;
            moon.position.copy(latLonToVec(moonDecl, moonLon, R_MOON_ORBIT));
            moon.lookAt(0,0,0);

            uiMoonAge.innerHTML = `${ageDays.toFixed(1)} <span class="data-unit">Hr</span>`;
            uiMoonPhase.innerHTML = `${phase.toFixed(1)} <span class="data-unit">%</span>`;
            uiMoonEl.innerHTML = `${elong.toFixed(1)}°`;

            let status = 'Bukan Fase Hilal', bg = 'rgba(255,255,255,0.1)', col = '#fff';
            if (ageDays > 0 && ageDays < 2.5) {
                if (elong >= 6.4) {
                    status = 'Terlihat (Kriteria MABIMS)'; bg = 'rgba(0, 255, 136, 0.2)'; col = '#00ff88';
                } else {
                    status = 'Belum Terlihat (Elongasi Rendah)'; bg = 'rgba(255, 179, 0, 0.2)'; col = '#ffb300';
                }
            } else if (ageDays > 27) {
                status = 'Fase Bulan Tua'; bg = 'rgba(150, 150, 150, 0.2)'; col = '#aaa';
            }
            uiHilalStatus.innerText = status;
            uiHilalStatus.style.background = bg;
            uiHilalStatus.style.color = col;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!initialized) return;

            if(clouds) clouds.rotation.y += 0.0004;

            if(issGroup) {
                issGroup.position.lerp(issTarget, 0.05);
                issGroup.lookAt(0,0,0);
            }

            updateAstronomy();

            const camLocal = camera.position.clone();
            labels.forEach(l => {
                const dot = camLocal.clone().normalize().dot(l.pos.clone().normalize());
                l.el.style.opacity = dot > 0.25 ? '1' : '0';
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
